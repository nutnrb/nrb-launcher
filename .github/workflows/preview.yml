name: Preview Build

# Build an installable preview for any non-main branch.
#
# - Pushed on any branch except main → builds, signs, and uploads to R2 under
#   preview/<sanitized-branch>-<short-sha>/. Does NOT touch root latest.json
#   and does NOT create a GitHub Release, so installed users are unaffected.
# - Tag pushes (refs/tags/v*) are excluded here; they fall through to upload.yml.
# - workflow_dispatch lets you trigger manually for any ref (mostly for debugging).

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - 'v*'
  workflow_dispatch:

# Cancel any in-flight preview build for the same ref. Each new commit to a
# branch supersedes the previous run for that branch.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

# Same permissions shape as upload.yml — we don't publish to GH Releases so
# contents: write is not strictly required, but keep parity for the gh CLI in
# the summary step (if used) and for future flexibility.
permissions:
  contents: read

# Job-level env. Mirrors upload.yml so the R2 client picks up the endpoint
# and credentials identically. R2_BUCKET is the actual bucket name; the
# public-facing object prefix is /nrb-launcher/.
env:
  R2_BUCKET: "nrb-releases"
  R2_PUBLIC_URL: "https://releases.nutnrb.com"
  AWS_REGION: auto
  AWS_S3_ADDRESSING_STYLE: path

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # R2 auth via raw static keys + S3 endpoint URL — mirrors upload.yml.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve preview version
        id: ver
        shell: bash
        run: |
          # Derive a version like 0.5.1-preview.<short-sha>-<sanitized-branch>.
          # - BASE_VERSION comes from package.json (the current "next" version).
          # - SHORT_SHA is 7 chars of HEAD.
          # - BRANCH is sanitized for path use: [A-Za-z0-9-], lowercase,
          #   max 40 chars. Anything else (slashes, underscores, dots,
          #   emoji, etc.) becomes a hyphen.
          set -euo pipefail
          BASE_VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          SHORT_SHA=$(echo "${{ github.head_sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/_. ' '----' | tr '[:upper:]' '[:lower:]' | cut -c1-40)
          PREVIEW_VERSION="${BASE_VERSION}-preview.${SHORT_SHA}.${BRANCH}"
          echo "version=${PREVIEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_VERSION=${PREVIEW_VERSION}"
          echo "BRANCH=${BRANCH}"
          echo "SHORT_SHA=${SHORT_SHA}"

      - name: Override version in tauri.conf.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Override version in package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            c.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(c, null, 2) + '\n');
          "

      - name: Override version in Cargo.toml
        shell: bash
        run: |
          # Replace the FIRST occurrence of `version = "..."` (the one under
          # [package]). cargo update -p nrb-launcher below will refresh Cargo.lock.
          sed -i '0,/^version = ".*"/s//version = "${{ steps.ver.outputs.version }}"/' src-tauri/Cargo.toml

      - name: Refresh Cargo.lock for the new package version
        # Without this, `cargo build` would fail because Cargo.toml's [package]
        # version (e.g. 0.5.1-preview.abc1234.branch) no longer matches the
        # version pinned for nrb-launcher in Cargo.lock. We `cd` into src-tauri
        # first so cargo picks up the right Cargo.toml without us having to
        # worry about path-translation issues on windows-latest's Git Bash.
        shell: bash
        run: |
          cd src-tauri
          cargo update -p nrb-launcher --offline

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri installer (NSIS only)
        # We do NOT use tauri-action here: tauri-action wants a tag and would
        # publish a GitHub Release, both of which we don't want for previews.
        shell: bash
        run: pnpm tauri build --bundles nsis

      - name: Find NSIS installer
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # Strip Windows CRLF line endings (same fix as upload.yml).
          EXE_PATH=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1 | tr -d '\r')
          if [ -z "${EXE_PATH}" ]; then
            echo "::error::No NSIS installer found under src-tauri/target/release/bundle/nsis/"
            exit 1
          fi
          EXE_NAME=$(basename "${EXE_PATH}")
          echo "EXE_PATH=${EXE_PATH}"
          echo "exe_path=${EXE_PATH}" >> "$GITHUB_OUTPUT"
          echo "exe_name=${EXE_NAME}" >> "$GITHUB_OUTPUT"
          echo "key_prefix=preview/${{ steps.ver.outputs.branch }}-${{ steps.ver.outputs.sha }}" >> "$GITHUB_OUTPUT"

      # Sign the NSIS installer for the R2 upload. Same pattern as upload.yml's
      # "Sign installer for R2 upload" step: write key bytes to a temp file,
      # unset TAURI_SIGNING_PRIVATE_KEY from env before invoking tauri-cli
      # (clap rejects env var + --private-key-path combination).
      - name: Sign installer for R2 upload
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXE_PATH="${{ steps.find.outputs.exe_path }}"
          echo "Signing: ${EXE_PATH}"

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing in this repo."
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing in this repo."
            exit 1
          fi

          KEY_BYTES="${TAURI_SIGNING_PRIVATE_KEY}"
          unset TAURI_SIGNING_PRIVATE_KEY

          KEY_FILE="$(mktemp -t tauri-key.XXXXXX)"
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s' "${KEY_BYTES}" > "${KEY_FILE}"

          KEY_SIZE=$(wc -c < "${KEY_FILE}" | tr -d ' ')
          echo "Wrote ${KEY_SIZE}-byte key to temp file"
          if [ "${KEY_SIZE}" != "348" ]; then
            echo "::error::Expected 348-byte private key but got ${KEY_SIZE} bytes."
            exit 1
          fi

          SIGN_LOG="$(mktemp -t tauri-sign.XXXXXX.log)"
          set +e
          pnpm tauri signer sign \
            --private-key-path "${KEY_FILE}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            "${EXE_PATH}" \
            >"${SIGN_LOG}.stdout" 2>"${SIGN_LOG}.stderr"
          SIGN_EXIT=$?
          set -e
          echo "sign exit code: ${SIGN_EXIT}"
          echo "--- last 30 lines of sign stdout ---"
          tail -n 30 "${SIGN_LOG}.stdout" || true
          echo "--- last 30 lines of sign stderr ---"
          tail -n 30 "${SIGN_LOG}.stderr" || true
          if [ "${SIGN_EXIT}" -ne 0 ]; then
            echo "::error::tauri signer sign failed (exit ${SIGN_EXIT}). See full output above."
            rm -f "${SIGN_LOG}.stdout" "${SIGN_LOG}.stderr" "${SIGN_LOG}"
            exit 1
          fi
          rm -f "${SIGN_LOG}.stdout" "${SIGN_LOG}.stderr" "${SIGN_LOG}"

          if [ ! -f "${EXE_PATH}.sig" ]; then
            echo "::error::signer sign ran but ${EXE_PATH}.sig was not produced"
            exit 1
          fi
          ls -la "${EXE_PATH}.sig"

      - name: Upload installer + signature to R2 (preview path)
        shell: bash
        run: |
          set -euo pipefail
          EXE_PATH="${{ steps.find.outputs.exe_path }}"
          EXE_NAME="${{ steps.find.outputs.exe_name }}"
          KEY_PREFIX="${{ steps.find.outputs.key_prefix }}"
          SIG_PATH="${EXE_PATH}.sig"

          echo "Uploading to s3://${R2_BUCKET}/nrb-launcher/${KEY_PREFIX}/"
          aws s3 cp "${EXE_PATH}" "s3://${R2_BUCKET}/nrb-launcher/${KEY_PREFIX}/${EXE_NAME}"
          if [ -f "${SIG_PATH}" ]; then
            aws s3 cp "${SIG_PATH}" "s3://${R2_BUCKET}/nrb-launcher/${KEY_PREFIX}/${EXE_NAME}.sig"
          else
            echo "::error::Signature file missing at ${SIG_PATH}"
            exit 1
          fi

      - name: Generate and upload preview latest.json
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXE_PATH="${{ steps.find.outputs.exe_path }}"
          EXE_NAME="${{ steps.find.outputs.exe_name }}"
          KEY_PREFIX="${{ steps.find.outputs.key_prefix }}"
          SIG_PATH="${EXE_PATH}.sig"

          if [ ! -f "${SIG_PATH}" ]; then
            echo "::error::Expected signature file ${SIG_PATH} not found."
            exit 1
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          R2_DOMAIN="releases.nutnrb.com"

          # Same shape as upload.yml's latest.json, but pointed at the
          # preview URL so the updater would only see it if configured to
          # (which we don't do — this file is here so a developer can
          # point a manually-patched tauri.conf.json at it for testing).
          jq -n \
            --arg version "${VERSION}" \
            --arg notes "Preview build for ${{ steps.ver.outputs.branch }}@${{ steps.ver.outputs.sha }}" \
            --arg pub_date "${PUB_DATE}" \
            --arg url "https://${R2_DOMAIN}/nrb-launcher/${KEY_PREFIX}/${EXE_NAME}" \
            --rawfile signature "${SIG_PATH}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $signature,
                  url: $url
                }
              }
            }' > latest.json
          cat latest.json

          aws s3 cp latest.json "s3://${R2_BUCKET}/nrb-launcher/${KEY_PREFIX}/latest.json" \
            --cache-control "no-cache"
          rm -f latest.json

      - name: Write job summary with download URLs
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ steps.ver.outputs.branch }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          EXE_NAME="${{ steps.find.outputs.exe_name }}"
          KEY_PREFIX="${{ steps.find.outputs.key_prefix }}"
          BASE="https://releases.nutnrb.com/nrb-launcher/${KEY_PREFIX}"
          EXE_URL="${BASE}/${EXE_NAME}"
          SIG_URL="${BASE}/${EXE_NAME}.sig"
          JSON_URL="${BASE}/latest.json"

          {
            echo "## Preview build — \`${VERSION}\`"
            echo ""
            echo "Branch: \`${BRANCH}\` · SHA: \`${SHA}\`"
            echo ""
            echo "| Asset | URL |"
            echo "|---|---|"
            echo "| Installer | <${EXE_URL}> |"
            echo "| Signature | <${SIG_URL}> |"
            echo "| Manifest  | <${JSON_URL}> |"
            echo ""
            echo "### How to install"
            echo ""
            echo "1. Download the installer from the URL above."
            echo "2. Run the \`.exe\` (NSIS installer). It will install side-by-side"
            echo "   with your stable build because the version differs, so your"
            echo "   stable install is preserved."
            echo "3. Uninstall the preview via Windows \`Settings → Apps\` when"
            echo "   you're done — it does not auto-update."
            echo ""
            echo "> The root \`latest.json\` was NOT touched, so no installed user"
            echo "> is offered this preview as an automatic update."
          } >> "$GITHUB_STEP_SUMMARY"