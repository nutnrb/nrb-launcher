name: Preview Build (push to main)

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri installer (preview pre-release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for includeUpdaterJson to actually emit latest.json.
          # User must set these secrets in the repo's settings; without
          # them the pre-release will publish but no in-app update is offered.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: preview-${{ github.sha }}
          releaseName: "Preview ${{ github.sha }}"
          releaseBody: "Auto-generated preview build from commit ${{ github.sha }}.\n\n[See commit](${{ github.event.head_commit.url }})"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          updaterJsonKeepDays: 90
          args: --target x86_64-pc-windows-msvc

      # Keep a stable `preview-latest` alias so the in-app updater can
      # always fetch the most recent preview manifest via a fixed URL.
      - name: Repoint preview-latest tag to this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Delete the existing preview-latest release if any. Use || true
          # so first run is fine; continue-on-error so we still try the
          # git-tag fallback below.
          gh release delete preview-latest --yes 2>/dev/null || true
          gh release create preview-latest
            --repo "${{ github.repository }}"
            --target "preview-${{ github.sha }}"
            --prerelease
            --notes "Rolling pointer to the most recent preview build. The in-app updater reads latest.json from this tag."
        continue-on-error: true

      # Propagate latest.json from the just-built preview-<sha> release to
      # the rolling preview-latest release so the in-app updater has a
      # stable URL to read. Marked continue-on-error because this only
      # works when tauri-action actually emitted latest.json, which
      # requires the TAURI_SIGNING_PRIVATE_KEY secret to be set. Without
      # it the pre-release installer still publishes; this step just
      # can't wire the in-app update.
      - name: Propagate latest.json to preview-latest release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view preview-latest >/dev/null 2>&1; then
            gh release create preview-latest \
              --repo "${{ github.repository }}" \
              --target "preview-${{ github.sha }}" \
              --prerelease \
              --notes "Rolling pointer to the most recent preview. The in-app updater reads latest.json from this release."
          fi
          TMP=$(mktemp -d)
          # tauri-action emits the manifest as `latest-${targetTriple}.json`.
          # If it doesn't exist, the in-app update path isn't wired yet
          # (need to set TAURI_SIGNING_PRIVATE_KEY secret) - exit 0 so we
          # don't fail the whole job.
          if ! gh release download "preview-${{ github.sha }}" \
              --repo "${{ github.repository }}" \
              --pattern "latest*.json" \
              --dir "$TMP" 2>/dev/null; then
            echo "::warning::No latest*.json found in preview-${{ github.sha }} release. In-app update won't work until TAURI_SIGNING_PRIVATE_KEY secret is set."
            exit 0
          fi
          for f in "$TMP"/latest*.json; do
            gh release upload preview-latest "$f" \
              --repo "${{ github.repository }}" \
              --clobber
          done

