name: Preview Build (push to main)

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri installer (preview pre-release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: preview-${{ github.sha }}
          releaseName: "Preview ${{ github.sha }}"
          releaseBody: "Auto-generated preview build from commit ${{ github.sha }}.\n\n[See commit](${{ github.event.head_commit.url }})"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          updaterJsonKeepDays: 90
          args: --target x86_64-pc-windows-msvc

      # Keep a stable `preview-latest` alias so the in-app updater can
      # always fetch the most recent preview manifest via a fixed URL.
      - name: Repoint preview-latest tag to this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Delete the existing preview-latest release if any. Use || true
          # so first run is fine; continue-on-error so we still try the
          # git-tag fallback below.
          gh release delete preview-latest --yes 2>/dev/null || true
          gh release create preview-latest
            --repo "${{ github.repository }}"
            --target "preview-${{ github.sha }}"
            --prerelease
            --notes "Rolling pointer to the most recent preview build. The in-app updater reads latest.json from this tag."
        continue-on-error: true

      # Copy latest.json from the just-built preview-<sha> release to the
      # rolling preview-latest release so the in-app updater has a stable
      # URL to read.
      - name: Propagate latest.json to preview-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view preview-latest >/dev/null 2>&1; then
            gh release create preview-latest \
              --repo "${{ github.repository }}" \
              --target "preview-${{ github.sha }}" \
              --prerelease \
              --notes "Rolling pointer to the most recent preview. The in-app updater reads latest.json from this release."
          fi
          # Download latest.json from the per-commit preview release and
          # upload it to the rolling preview-latest release so the
          # endpoint below always serves the newest manifest.
          TMP=$(mktemp -d)
          gh release download "preview-${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --pattern latest.json \
            --dir "$TMP"
          gh release upload preview-latest "$TMP/latest.json" \
            --repo "${{ github.repository }}" \
            --clobber

