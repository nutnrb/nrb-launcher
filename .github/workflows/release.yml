name: Release NRB Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            bundleArgs: ''
          - platform: windows-latest
            target: ''
            bundleArgs: '--bundles nsis'
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: '--bundles app,dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundleArgs: '--bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    env:
      # Avoid codesign failures on unsigned macOS dev/release builds
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Silence DMG notarization prompts on CI
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      # Verbose Rust/Tauri output to help diagnose bundler issues
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux deps (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (verbose)
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NRB Launcher ${{ github.ref_name }}"
          releaseBody: "Auto-generated release for NRB Launcher."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0} {1} --verbose', matrix.target, matrix.bundleArgs) || format('{0} --verbose', matrix.bundleArgs) }}
        continue-on-error: true

      - name: Diagnostic dump on failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/diag
          OUT=/tmp/diag/tauri-debug.log
          {
            echo "=== environment ==="
            uname -a 2>&1 || ver
            echo "--- rust ---"
            rustc --version 2>&1
            cargo --version 2>&1
            echo "--- node ---"
            node --version 2>&1
            pnpm --version 2>&1
            echo "--- pnpm tauri version ---"
            pnpm tauri --version 2>&1
            echo "--- platform tools ---"
            which makensis 2>&1 || true
            which candle 2>&1 || true
            which light 2>&1 || true
            which codesign 2>&1 || true
            which png2icns 2>&1 || true
            which iconutil 2>&1 || true
            echo "--- target bundle dirs ---"
            ls -la src-tauri/target/ 2>&1
            find src-tauri/target -maxdepth 5 -type d -name 'bundle' 2>&1
            echo "--- icons ---"
            ls -la src-tauri/icons/ 2>&1
            file src-tauri/icons/* 2>&1
            echo "--- attempt plain cargo build for diagnostics ---"
            cd src-tauri
            cargo build --release 2>&1 | tail -150
            cd ..
            echo "--- attempt tauri build --no-bundle ---"
            pnpm tauri build --no-bundle --verbose 2>&1 | tail -300
          } > "$OUT" 2>&1
          echo "--- diag file written to $OUT ($(wc -c < $OUT) bytes) ---"
          tail -200 "$OUT"
        continue-on-error: true

      - name: Upload diagnostic log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-debug-${{ matrix.platform }}-${{ matrix.target || 'default' }}
          path: /tmp/diag/tauri-debug.log
          if-no-files-found: ignore
          retention-days: 7
        continue-on-error: true

      - name: Show artifacts on failure
        if: failure()
        run: |
          echo "::error::Build failed for ${{ matrix.platform }} (${{ matrix.target }}). See uploaded tauri-debug-* artifact for details."
