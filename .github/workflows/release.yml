name: Release NRB Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            bundleArgs: ''
          - platform: windows-latest
            target: ''
            bundleArgs: '--bundles nsis'
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: '--bundles app,dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundleArgs: '--bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    env:
      # Avoid codesign failures on unsigned macOS dev/release builds
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Silence DMG notarization prompts on CI
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux deps (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      # Pre-install Windows bundle tooling (Tauri 2 requires NSIS, WiX is optional)
      - name: Install NSIS (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install -y nsis 2>&1 || scoop install nsis 2>&1 || echo "Bundle tooling install via package manager failed; relying on Tauri's auto-download"

      # Generate macOS .icns icon from .png (required by tauri bundler on macOS)
      - name: Generate icon.icns for macOS
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/icons
          if [ ! -f icon.icns ]; then
            mkdir -p icon.iconset
            cp icon.png icon.iconset/icon_512x512.png
            sips -z 512 512 icon.png --out icon.iconset/icon_512x512.png 2>&1 || true
            sips -z 256 256 icon.png --out icon.iconset/icon_256x256.png 2>&1 || true
            sips -z 128 128 icon.png --out icon.iconset/icon_128x128.png 2>&1 || true
            iconutil -c icns icon.iconset -o icon.icns 2>&1 || true
            rm -rf icon.iconset
          fi
          ls -la icon.icns 2>&1 || echo "icon.icns generation failed"
          cd ../..

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NRB Launcher ${{ github.ref_name }}"
          releaseBody: "Auto-generated release for NRB Launcher."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0} {1}', matrix.target, matrix.bundleArgs) || format('{0}', matrix.bundleArgs) }}

      - name: Show artifacts on failure
        if: failure()
        run: |
          echo "::error::Build failed for ${{ matrix.platform }} (${{ matrix.target }}). See workflow log for actual error."
