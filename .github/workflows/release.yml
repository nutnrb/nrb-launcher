name: Release NRB Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            bundleArgs: ''
          - platform: windows-latest
            target: ''
            bundleArgs: '--bundles nsis'
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: '--bundles app,dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundleArgs: '--bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux deps (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NRB Launcher ${{ github.ref_name }}"
          releaseBody: "Auto-generated release for NRB Launcher."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0} {1}', matrix.target, matrix.bundleArgs) || format('{0}', matrix.bundleArgs) }}

      - name: Capture tauri build + bundle state
        shell: bash
        if: always()
        run: |
          set +e
          mkdir -p .ci-debug
          OUT=".ci-debug/${GITHUB_RUN_ID}-${{ matrix.platform }}-${{ matrix.target || 'default' }}-inspect.md"
          {
            echo "## Bundle inspection"
            echo ""
            echo "Platform: \`${{ matrix.platform }}\`  Target: \`${{ matrix.target || 'host' }}\`  Run: \`${GITHUB_RUN_ID}\`  SHA: \`${GITHUB_SHA}\`"
            echo ""
            echo "### tauri version"
            echo '```'
            pnpm tauri --version 2>&1 | head -3
            echo '```'
            echo ""
            echo "### bundle target tree"
            echo '```'
            find src-tauri/target -maxdepth 6 -type d \( -name 'bundle' -o -name 'release' \) 2>&1 | head -20
            echo '```'
            echo ""
            echo "### bundle files (msi, exe, nsis, deb, AppImage, app, dmg, pkg)"
            echo '```'
            find src-tauri/target -maxdepth 8 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.nsis' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app' -o -name '*.dmg' -o -name '*.pkg' \) -printf '%p (%s bytes)\n' 2>&1 | head -30
            echo '```'
            echo ""
            echo "### bundle dir listing"
            echo '```'
            find src-tauri/target -maxdepth 8 -type d -name 'bundle' -exec ls -laR {} \; 2>&1 | head -100
            echo '```'
            echo ""
            echo "### releases (via curl)"
            echo '```'
            curl -sL "https://api.github.com/repos/nutnrb/nrb-launcher/releases/tags/${GITHUB_REF_NAME#refs/tags/}" -H "Accept: application/vnd.github+json" | head -c 500
            echo ''
            echo '```'
          } > "$OUT"
          echo "Wrote $OUT ($(wc -c < $OUT) bytes)"

      - name: Publish diagnostic
        if: always()
        shell: bash
        run: |
          set +e
          BRANCH="ci-debug/run-${GITHUB_RUN_ID}/${{ matrix.platform }}-${{ matrix.target || 'default' }}"
          cd "$GITHUB_WORKSPACE"
          git config user.email "nrb-bot@nutnrb.local"
          git config user.name "NRB CI Bot"
          git checkout -B "$BRANCH" 2>&1
          # Ensure .ci-debug is added even if it is empty / untracked
          find .ci-debug -type f -print
          git add -A .ci-debug/ 2>&1
          git add -f .ci-debug/ 2>&1
          # Create a marker file if no .ci-debug files were created
          if [ -z "$(ls -A .ci-debug/ 2>/dev/null)" ]; then
            echo "no debug files were generated" > ".ci-debug/${GITHUB_RUN_ID}-${{ matrix.platform }}-${{ matrix.target || 'default' }}-empty.md"
            git add .ci-debug/ 2>&1
          fi
          git commit -m "ci-debug: bundle inspection for run ${GITHUB_RUN_ID} ${{ matrix.platform }} ${{ matrix.target }}" 2>&1
          git push -u origin "$BRANCH" 2>&1
          echo "Pushed $BRANCH"
        continue-on-error: true
