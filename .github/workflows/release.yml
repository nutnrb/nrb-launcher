name: Release NRB Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            bundleArgs: ''
          - platform: windows-latest
            target: ''
            bundleArgs: '--bundles nsis,msi'
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: '--bundles app,dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundleArgs: '--bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    env:
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      # Code signing secrets are optional. When present, tauri-action picks them up automatically.
      # When absent, tauri-action skips signing and produces unsigned artifacts (build still succeeds).
      WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      API_KEY_ID: ${{ secrets.API_KEY_ID }}
      API_KEY_FILE: ${{ secrets.API_KEY_FILE }}
      API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
      # Auto-discovery is on by default, but we only enable it when at least one signing secret exists
      # to avoid noisy warnings on unsigned builds.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux deps (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Import GPG signing key (Linux only, optional)
        if: matrix.platform == 'ubuntu-22.04' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --import --batch
          printf 'allow-preset-passphrase\ndefault-cache-ttl 600\nmax-cache-ttl 7200\n' | gpgconf --change-options gpg-agent
          gpgconf --reload gpg-agent
          # Prime the agent with the passphrase so subsequent detached-sign calls do not prompt
          echo "$GPG_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --sign --detach-sign --output /tmp/.gpg-prime /dev/null
          rm -f /tmp/.gpg-prime

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NRB Launcher ${{ github.ref_name }}"
          releaseBody: "Auto-generated release for NRB Launcher."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target && format('--target {0} {1}', matrix.target, matrix.bundleArgs) || format('{0}', matrix.bundleArgs) }}

      - name: Sign Linux bundles with GPG (Linux only, optional)
        if: matrix.platform == 'ubuntu-22.04' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          for dir in deb appimage; do
            if [ -d "$dir" ]; then
              cd "$dir"
              shopt -s nullglob
              for f in *.deb *.AppImage; do
                echo "Signing $f"
                echo "$GPG_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 \
                  --armor --detach-sign --sign "$f"
              done
              cd ..
            fi
          done
          echo "=== Signed artifacts ==="
          find deb appimage -maxdepth 1 \( -name '*.sig' -o -name '*.asc' \) 2>/dev/null || true

      - name: Upload GPG signatures (Linux only)
        if: matrix.platform == 'ubuntu-22.04' && env.GPG_PRIVATE_KEY != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/deb/*.asc
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/appimage/*.asc
          fail_on_unmatched_files: false