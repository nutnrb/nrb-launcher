name: Release NRB Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            bundleArgs: ''
          - platform: windows-latest
            target: ''
            bundleArgs: '--bundles nsis'
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: '--bundles app,dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundleArgs: '--bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    env:
      # Avoid codesign failures on unsigned macOS dev/release builds
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Silence DMG notarization prompts on CI
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux deps (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NRB Launcher ${{ github.ref_name }}"
          releaseBody: "Auto-generated release for NRB Launcher."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0} {1} --verbose', matrix.target, matrix.bundleArgs) || format('{0} --verbose', matrix.bundleArgs) }}
        continue-on-error: true

      - name: Run plain tauri build for diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          {
            echo "### Diagnostic capture (failure on ${{ matrix.platform }} target=${{ matrix.target }})"
            echo ""
            echo "#### environment"
            echo '```'
            uname -a 2>&1 || ver
            rustc --version 2>&1
            cargo --version 2>&1
            node --version 2>&1
            pnpm --version 2>&1
            echo '```'
            echo "#### platform tools"
            echo '```'
            which makensis 2>&1 || true
            which candle 2>&1 || true
            which light 2>&1 || true
            which codesign 2>&1 || true
            which png2icns 2>&1 || true
            which iconutil 2>&1 || true
            echo '```'
            echo "#### target bundle dirs"
            echo '```'
            ls -la src-tauri/target/ 2>&1
            find src-tauri/target -maxdepth 5 -type d -name 'bundle' 2>&1
            echo '```'
            echo "#### icons"
            echo '```'
            ls -la src-tauri/icons/ 2>&1
            file src-tauri/icons/* 2>&1
            echo '```'
            echo "#### pnpm tauri build --no-bundle --verbose (last 300 lines)"
            echo '```'
            pnpm tauri build --no-bundle --verbose 2>&1 | tail -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::See step summary above for diagnostic details."
        continue-on-error: true

      - name: Show artifacts on failure
        if: failure()
        run: |
          echo "::error::Build failed for ${{ matrix.platform }} (${{ matrix.target }}). See step summary for diagnostics."
