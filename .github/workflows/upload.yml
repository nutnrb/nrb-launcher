name: Build & Upload to R2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: "nrb-releases"
  R2_PUBLIC_URL: "https://releases.nutnrb.com"

jobs:
  build-and-upload:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # R2 auth: use raw static keys + S3 endpoint URL.
      # Drop aws-actions/configure-aws-credentials entirely (Cloudflare R2 has no STS,
      # and the action is overkill for a static-key + custom-endpoint S3 client).
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_S3_ADDRESSING_STYLE: path
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          fi
          echo "VERSION=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "NRB Launcher ${{ steps.version.outputs.version }}"
          releaseBody: "Auto-generated release for ${{ steps.version.outputs.version }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      - name: Find NSIS installer
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          echo "EXE=${EXE}"
          echo "exe=${EXE}" >> "$GITHUB_OUTPUT"
          VERSION="${{ steps.version.outputs.version }}"
          echo "installer_name=NRB Launcher_${VERSION}_x64-setup.exe" >> "$GITHUB_OUTPUT"

      # Sign the NSIS installer locally for the R2 upload.
      #
      # Why we sign here even though tauri-action already produces a signed
      # GitHub-Release asset: tauri-action uploads its own signature only into
      # the GitHub Release manifest (latest.json). It does NOT write
      # `${EXE_PATH}.sig` next to the local NSIS bundle, so the R2 upload
      # step below would silently skip the .sig file. Re-running the Tauri
      # signer here guarantees `${EXE_PATH}.sig` exists on disk.
      #
      # The signing key is supplied as a GitHub Actions secret
      # (TAURI_SIGNING_PRIVATE_KEY) and its password as
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD — both already used by tauri-action
      # above, see docs/CODE_SIGNING.md.
      - name: Sign installer for R2 upload
        shell: bash
        env:
          # Both TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # are loaded from secrets. The password is auto-read by tauri-cli.
          # The key is written to a temp file via printf and passed via
          # --private-key-path.
          #
          # CRITICAL: We must UNSET TAURI_SIGNING_PRIVATE_KEY before running
          # `pnpm tauri signer sign`. tauri-cli's clap reads it from env and
          # rejects "cannot be used with '--private-key <PRIVATE_KEY>'" if
          # --private-key-path is also passed. So the env block sets both
          # secrets (giving the bash script access to the key string), but the
          # script then unsets the key var and uses --private-key-path
          # exclusively. This avoids the clap exit-2 conflict that the
          # ff1697c run hit.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Strip Windows CRLF line endings from the EXE path. On
          # windows-latest (Git Bash), `ls` emits \r\n, so a naive
          # `$(ls ... | head -1)` produces a path ending in \r — which
          # then gets passed verbatim to `pnpm tauri signer sign` and
          # produces a "no such file" error since "setup.exe\r" is not
          # the real filename. Linux runners have no \r, so this is a
          # no-op there.
          EXE_PATH=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1 | tr -d '\r')
          if [ -z "${EXE_PATH}" ]; then
            echo "::error::No NSIS installer found under src-tauri/target/release/bundle/nsis/"
            exit 1
          fi
          echo "Signing: ${EXE_PATH}"

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing in this repo. Add it under Settings → Secrets and variables → Actions. See docs/CODE_SIGNING.md for the expected format."
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing in this repo. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Capture key bytes in a local var before unsetting the env
          # var (see the env: comment for why).
          KEY_BYTES="${TAURI_SIGNING_PRIVATE_KEY}"
          unset TAURI_SIGNING_PRIVATE_KEY

          # Write to a temp file (LF-terminated via `printf '%s'`).
          KEY_FILE="$(mktemp -t tauri-key.XXXXXX)"
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s' "${KEY_BYTES}" > "${KEY_FILE}"

          # Sanity-check that the temp file got written — without this,
          # an empty env (a previous bug) produced a silent "empty key"
          # error that was hard to attribute to the secret.
          KEY_SIZE=$(wc -c < "${KEY_FILE}" | tr -d ' ')
          echo "Wrote ${KEY_SIZE}-byte key to temp file"
          if [ "${KEY_SIZE}" != "348" ]; then
            echo "::error::Expected 348-byte private key but got ${KEY_SIZE} bytes. The TAURI_SIGNING_PRIVATE_KEY secret is likely truncated, missing, or has stray characters."
            exit 1
          fi

          # Wrap the sign call so that any stderr from tauri-cli is
          # captured even if `set -e` would otherwise short-circuit. The
          # last 30 lines are echoed so that "Wrong password" / "no
          # such file" / clap-parse errors surface in the step log
          # output (annotations only show one line; full logs require
          # repo admin, so we self-emit the relevant slice here).
          SIGN_LOG="$(mktemp -t tauri-sign.XXXXXX.log)"
          set +e
          pnpm tauri signer sign \
            --private-key-path "${KEY_FILE}" \
            --app-version "${{ steps.version.outputs.version }}" \
            "${EXE_PATH}" \
            >"${SIGN_LOG}.stdout" 2>"${SIGN_LOG}.stderr"
          SIGN_EXIT=$?
          set -e
          echo "sign exit code: ${SIGN_EXIT}"
          echo "--- last 30 lines of sign stdout ---"
          tail -n 30 "${SIGN_LOG}.stdout" || true
          echo "--- last 30 lines of sign stderr ---"
          tail -n 30 "${SIGN_LOG}.stderr" || true
          if [ "${SIGN_EXIT}" -ne 0 ]; then
            # Map common failures to a ::error:: annotation. The
            # annotations page only renders the LAST ::error:: per step,
            # so emit the most specific one we can identify.
            if grep -q "Wrong password" "${SIGN_LOG}.stderr" 2>/dev/null; then
              echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD does not match TAURI_SIGNING_PRIVATE_KEY. The new key was rotated and a fresh password was generated; confirm the repo secret was updated (not the previous password)."
            elif grep -q "No such device" "${SIGN_LOG}.stderr" 2>/dev/null; then
              echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing or empty."
            elif grep -q "No NSIS installer" "${SIGN_LOG}.stderr" 2>/dev/null; then
              echo "::error::No NSIS installer found."
            elif grep -q "private-key" "${SIGN_LOG}.stderr" 2>/dev/null; then
              echo "::error::tauri-cli rejected the key path: $(cat ${SIGN_LOG}.stderr)"
            else
              echo "::error::tauri signer sign failed (exit ${SIGN_EXIT}). See full output above."
            fi
            rm -f "${SIGN_LOG}.stdout" "${SIGN_LOG}.stderr" "${SIGN_LOG}"
            exit 1
          fi
          rm -f "${SIGN_LOG}.stdout" "${SIGN_LOG}.stderr" "${SIGN_LOG}"

          if [ ! -f "${EXE_PATH}.sig" ]; then
            echo "::error::signer sign ran but ${EXE_PATH}.sig was not produced"
            exit 1
          fi
          ls -la "${EXE_PATH}.sig"

      - name: Upload installer to R2
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Get the actual exe name. Strip Windows \r line endings from
          # the path (see "Sign installer" step for the long-form
          # rationale).
          EXE_PATH=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1 | tr -d '\r')
          EXE_NAME=$(basename "$EXE_PATH")
          SIG_PATH="${EXE_PATH}.sig"

          echo "Uploading: $EXE_NAME"

          # AWS CLI v2 picks up AWS_ENDPOINT_URL_S3 / AWS_REGION from the job env,
          # so --endpoint-url / --region are intentionally omitted here.
          # Upload installer
          aws s3 cp "$EXE_PATH" "s3://${R2_BUCKET}/nrb-launcher/${EXE_NAME}"

          # Upload signature if exists
          if [ -f "$SIG_PATH" ]; then
            aws s3 cp "$SIG_PATH" "s3://${R2_BUCKET}/nrb-launcher/${EXE_NAME}.sig"
          fi

          echo "Done uploading installer"

      - name: Create and upload latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          EXE_NAME="NRB Launcher_${VERSION}_x64-setup.exe"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Get signature file (minisign .sig is multi-line; jq will
          # JSON-escape newlines properly when building latest.json below).
          EXE_PATH=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1 | tr -d '\r')
          SIG_PATH="${EXE_PATH}.sig"
          if [ ! -f "${SIG_PATH}" ]; then
            echo "::error::Expected signature file ${SIG_PATH} not found. The Sign installer step must run first."
            exit 1
          fi

          # Use custom domain for the public download URL so end users get a friendly releases.nutnrb.com link
          R2_DOMAIN="releases.nutnrb.com"

          # Build latest.json via jq so the multi-line minisign signature
          # is JSON-escaped correctly. Heredoc interpolation with a
          # newline-containing $SIGNATURE would yield invalid JSON.
          SIGNATURE_FILE="${SIG_PATH}"

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "Auto-generated release for ${VERSION}" \
            --arg pub_date "${PUB_DATE}" \
            --arg url "https://${R2_DOMAIN}/nrb-launcher/${EXE_NAME}" \
            --rawfile signature "${SIGNATURE_FILE}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $signature,
                  url: $url
                }
              }
            }' > latest.json
          cat latest.json

          # Upload latest.json to bucket (S3 API picks up AWS_ENDPOINT_URL_S3 / AWS_REGION
          # from the job env, so we don't pass --endpoint-url / --region here either).
          aws s3 cp latest.json "s3://${R2_BUCKET}/nrb-launcher/latest.json" \
            --cache-control "no-cache"

          echo "latest.json uploaded"

      - name: Print R2 URLs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          R2_PUBLIC_URL: ${{ env.R2_PUBLIC_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== R2 URLs (public, via custom domain) ==="
          echo "Installer: ${R2_PUBLIC_URL}/nrb-launcher/NRB Launcher_${VERSION}_x64-setup.exe"
          echo "latest.json: ${R2_PUBLIC_URL}/nrb-launcher/latest.json"
          echo ""
          echo "=== GitHub Release ==="
          echo "Tag: ${{ steps.version.outputs.tag }}"
          gh release view ${{ steps.version.outputs.tag }} --json url --jq '.url'