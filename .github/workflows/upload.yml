name: Build & Upload to R2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: "nrb-releases"
  R2_PUBLIC_URL: "https://releases.nutnrb.com"

jobs:
  build-and-upload:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          fi
          echo "VERSION=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "NRB Launcher ${{ steps.version.outputs.version }}"
          releaseBody: "Auto-generated release for ${{ steps.version.outputs.version }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      - name: Find NSIS installer
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          echo "EXE=${EXE}"
          echo "exe=${EXE}" >> "$GITHUB_OUTPUT"
          VERSION="${{ steps.version.outputs.version }}"
          echo "installer_name=NRB Launcher_${VERSION}_x64-setup.exe" >> "$GITHUB_OUTPUT"

      - name: Configure AWS CLI for R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto
          # R2 uses auto region

      - name: Upload installer to R2
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Get the actual exe name
          EXE_PATH=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          EXE_NAME=$(basename "$EXE_PATH")
          SIG_PATH="${EXE_PATH}.sig"
          
          echo "Uploading: $EXE_NAME"
          
          # Upload installer
          aws s3 cp "$EXE_PATH" "s3://${{ env.R2_BUCKET }}/nrb-launcher/$EXE_NAME" \
            --endpoint-url "https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          
          # Upload signature if exists
          if [ -f "$SIG_PATH" ]; then
            aws s3 cp "$SIG_PATH" "s3://${{ env.R2_BUCKET }}/nrb-launcher/${EXE_NAME}.sig" \
              --endpoint-url "https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          fi
          
          echo "Done uploading installer"

      - name: Create and upload latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          EXE_NAME="NRB Launcher_${VERSION}_x64-setup.exe"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Get signature
          EXE_PATH=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          SIG_PATH="${EXE_PATH}.sig"
          SIGNATURE=""
          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH")
          fi
          
          # Use custom domain for the public download URL so end users get a friendly releases.nutnrb.com link
          R2_DOMAIN="releases.nutnrb.com"
          
          cat > latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Auto-generated release for ${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://${R2_DOMAIN}/nrb-launcher/${EXE_NAME}"
              }
            }
          }
          JSON
          cat latest.json
          
          # Upload latest.json to bucket (S3 API still uses the account-id subdomain endpoint, not the custom domain)
          aws s3 cp latest.json "s3://${R2_BUCKET}/nrb-launcher/latest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "no-cache"
          
          echo "latest.json uploaded"

      - name: Print R2 URLs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          R2_PUBLIC_URL: ${{ env.R2_PUBLIC_URL }}
        run: |
          echo "=== R2 URLs (public, via custom domain) ==="
          echo "Installer: ${R2_PUBLIC_URL}/nrb-launcher/NRB Launcher_${{ env.VERSION }}_x64-setup.exe"
          echo "latest.json: ${R2_PUBLIC_URL}/nrb-launcher/latest.json"
          echo ""
          echo "=== GitHub Release ==="
          echo "Tag: ${{ steps.version.outputs.tag }}"
          gh release view ${{ steps.version.outputs.tag }} --json url --jq '.url'
